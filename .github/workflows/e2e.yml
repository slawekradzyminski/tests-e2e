name: e2e evaluation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Check out the training stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: slawekradzyminski/awesome-localstack
          ref: 0bc674e957e7fbc0a35f880ff71497832bffaeac
          path: .stack
      - name: Start the lightweight stack
        working-directory: .stack
        run: docker compose -f lightweight-docker-compose.yml up -d --wait
      - run: npm run typecheck
      - run: npm run verify:coverage
      - run: npm test -- --reporter list,junit,markdown
        env:
          APP_BASE_URL: http://localhost:8081
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-evidence
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
      - name: Stop the training stack
        if: always()
        working-directory: .stack
        run: docker compose -f lightweight-docker-compose.yml down
